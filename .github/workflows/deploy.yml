name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
      - name: Deploy to Google Cloud via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.ORACLE_PROJECT_DIR }}

            echo "=== Ensure git repo ==="
            if [ ! -d .git ]; then
              echo "No git repo detected - bootstrapping from GitHub..."
              git clone https://github.com/pepemza09/sacad.git /tmp/sacad-latest
              cp -a /tmp/sacad-latest/. .
              rm -rf /tmp/sacad-latest
            fi

            echo "=== Pull latest code ==="
            git fetch origin main && git reset --hard origin/main || (git fetch --unshallow && git fetch origin main && git reset --hard origin/main)

            echo "=== Check .env ==="
            if [ ! -f .env ]; then
              echo "ERROR: falta el archivo .env en ${{ secrets.ORACLE_PROJECT_DIR }}"
              echo "Crealo manualmente con:"
              echo "  scp .env ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:${{ secrets.ORACLE_PROJECT_DIR }}/.env"
              echo "Usa .env.example como plantilla (ajusta los valores de produccion)."
              exit 1
            fi

            echo "=== Backup DB ==="
            if docker compose -f docker-compose.prod.yml ps -q db 2>/dev/null | grep -q .; then
              COMPOSE_FILE=docker-compose.prod.yml ./scripts/backup.sh
            else
              echo "No hay base de datos corriendo - se omite el backup (deploy inicial)."
            fi

            echo "=== Build images (sin tocar los contenedores actuales) ==="
            docker compose -f docker-compose.prod.yml build || {
              echo "=== Build falló - se mantienen los contenedores actuales corriendo ==="
              exit 1
            }

            echo "=== Recreate containers ==="
            if ! docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans; then
              echo "=== Up falló - limpieza de contenedores viejos y reintento ==="
              docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            fi

            echo "=== Esperando a que los servicios estén sanos ==="
            for i in $(seq 1 30); do
              if python3 -c "import urllib.request; urllib.request.urlopen('http://localhost/', timeout=5)" 2>/dev/null; then
                echo "Frontend OK"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: el frontend no respondió tras 30 intentos."
                docker compose -f docker-compose.prod.yml ps
                exit 1
              fi
              sleep 5
            done
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)" 2>/dev/null; then
                echo "Backend OK"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: el backend no respondió tras 30 intentos."
                docker compose -f docker-compose.prod.yml ps
                exit 1
              fi
              sleep 5
            done

            echo "=== Clean old images (solo dangling) ==="
            docker image prune -f

            echo "=== Deploy complete ==="
